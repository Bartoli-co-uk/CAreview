name: Approved implementation issue
description: Track one bounded implementation item from the approved roadmap.
title: "[Issue]: "
body:
  - type: input
    id: issue_id
    attributes:
      label: Issue ID
      placeholder: ISSUE-0001
    validations:
      required: true
  - type: input
    id: roadmap
    attributes:
      label: Approved roadmap reference
      description: Link the roadmap commit and item.
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State one outcome, not a collection of unrelated changes.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: In scope and out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable criteria.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Required verification
      description: List real test, lint, build, documentation, and security checks.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Identify predecessor issues, protected actions, and known risks.
